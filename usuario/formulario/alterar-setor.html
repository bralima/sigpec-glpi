<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alteração de Perfil de Setor - GLPI SIGPEC</title>
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ===== MENU LATERAL ===== */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 22px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 17px;
            width: 118px;
        }
        .menu-lateral .requisicoes .item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .menu-lateral .requisicoes .item svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
        }
        /* ===== CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 13px;
            background: #FFFFFF;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 20px;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }
        /* ===== FORMULÁRIO ===== */
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .form-card {
            background: #FFFFFF;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            border-radius: 4px;
            overflow: hidden;
        }
        .form-card .titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 24px 8px 24px;
            font-size: 26px;
            font-weight: 600;
            color: #000;
        }
        .form-card .titulo svg {
            width: 40px;
            height: 40px;
            fill: #1C1B1F;
        }
        .form-card .dados-chamado {
            background: #F5F7FC;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 24px;
            font-size: 16px;
            color: #3B73A7;
            font-weight: 400;
        }
        .form-card .campo {
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-card .campo label {
            font-weight: 600;
            font-size: 13px;
            color: #000;
        }
        .form-card .campo input,
        .form-card .campo select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        .form-card .campo select {
            appearance: auto;
        }
        .form-card .campo .aviso {
            font-size: 11px;
            color: #d32f2f;
            margin-top: 2px;
        }
        .form-card .acoes {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }
        .btn-enviar {
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-enviar:hover {
            background: #f0f0f0;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 480px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .requisicoes .item span { display: none; }
            .menu-lateral .recolher span { display: none; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL ===== -->
<div class="menu-lateral">
    <div class="requisicoes">
        <a href="../dashboard.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </a>
        <a href="../meus-chamados.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>FAQ</span>
        </div>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            <span>Reservas</span>
        </div>
    </div>
    <div class="recolher">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/></svg>
        <span>Recolher Menu</span>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços / Alteração de Perfil de Setor</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <div class="form-card">
            <!-- Título -->
            <div class="titulo">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Alteração de Perfil de Setor
            </div>
            <div class="dados-chamado">Dados do Chamado</div>

            <!-- Campo Nome de Usuário -->
            <div class="campo">
                <label for="nome">Nome de Usuário</label>
                <input type="text" id="nome" placeholder="Digite o nome completo" />
            </div>

            <!-- Campo Login de Usuário -->
            <div class="campo">
                <label for="login">Login de Usuário</label>
                <input type="text" id="login" placeholder="Digite o login" />
            </div>

            <!-- Campo Perfil de Setor Atual -->
            <div class="campo">
                <label for="perfilAtual">Perfil de Setor Atual</label>
                <select id="perfilAtual">
                    <option value="">Selecione...</option>
                    <!-- opções preenchidas via JS -->
                </select>
            </div>

            <!-- Campo Novo Perfil de Setor -->
            <div class="campo">
                <label for="perfilNovo">Novo Perfil de Setor</label>
                <select id="perfilNovo">
                    <option value="">Selecione...</option>
                    <!-- opções preenchidas via JS -->
                </select>
                <div class="aviso" id="avisoNovo"></div>
            </div>

            <!-- Botão Enviar -->
            <div class="acoes">
                <button class="btn-enviar" id="btnEnviar">Enviar</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== LISTA DE PERFIS DE SETOR =====
    const perfis = [
        "CMSP", "GERAL", "IPREM", "PENSIONISTA", "SFMSP", "TCMSP",
        "AHM_GERAL", "MUNICIPALIZADOS", "SMS", "IPREM_APOS", "APOS_SME",
        "SME", "AFASTADOS", "AHM-JSH", "AMLURB"
    ];

    // Referências aos selects
    const selectAtual = document.getElementById('perfilAtual');
    const selectNovo = document.getElementById('perfilNovo');
    const avisoNovo = document.getElementById('avisoNovo');

    // ===== Função para popular um select com a lista de perfis =====
    function popularSelect(select, valorSelecionado) {
        // Limpa o select (mantém apenas a primeira opção vazia)
        while (select.options.length > 1) {
            select.remove(1);
        }
        // Adiciona as opções
        perfis.forEach(perfil => {
            const option = document.createElement('option');
            option.value = perfil;
            option.textContent = perfil;
            if (perfil === valorSelecionado) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    // ===== Função para atualizar o select "Novo" excluindo o valor do "Atual" =====
    function atualizarNovo() {
        const valorAtual = selectAtual.value;
        // Limpa o selectNovo
        while (selectNovo.options.length > 1) {
            selectNovo.remove(1);
        }
        // Adiciona todos os perfis, exceto o valorAtual
        perfis.forEach(perfil => {
            if (perfil !== valorAtual) {
                const option = document.createElement('option');
                option.value = perfil;
                option.textContent = perfil;
                selectNovo.appendChild(option);
            }
        });
        // Se não houver opções, mostra aviso
        if (selectNovo.options.length === 1) {
            avisoNovo.textContent = '⚠️ Não há perfis disponíveis para selecionar.';
        } else {
            avisoNovo.textContent = '';
        }
        // Se o valor selecionado anteriormente no novo não estiver mais disponível, reseta
        if (selectNovo.value && selectNovo.value !== selectAtual.value) {
            // mantém
        } else {
            selectNovo.value = '';
        }
    }

    // ===== Popula os selects inicialmente =====
    popularSelect(selectAtual, '');
    popularSelect(selectNovo, '');

    // ===== Evento: quando o "Atual" muda, atualiza o "Novo" =====
    selectAtual.addEventListener('change', function() {
        atualizarNovo();
    });

    // ===== Evento: ao enviar (apenas alerta) =====
    document.getElementById('btnEnviar').addEventListener('click', function(e) {
        e.preventDefault();
        const nome = document.getElementById('nome').value.trim();
        const login = document.getElementById('login').value.trim();
        const atual = selectAtual.value;
        const novo = selectNovo.value;

        if (!nome || !login || !atual || !novo) {
            alert('Por favor, preencha todos os campos.');
            return;
        }
        alert(`Chamado de alteração de perfil enviado com sucesso!\n\nNome: ${nome}\nLogin: ${login}\nAtual: ${atual}\nNovo: ${novo}`);
        // Aqui você pode redirecionar para o dashboard ou limpar o formulário
    });
</script>

</body>
</html>
