<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ativar Acesso de Usuário - GLPI SIGPEC</title>
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ===== MENU LATERAL ===== */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 22px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 17px;
            width: 118px;
        }
        .menu-lateral .requisicoes .item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .menu-lateral .requisicoes .item svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
        }
        /* ===== CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 13px;
            background: #FFFFFF;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 20px;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }
        /* ===== FORMULÁRIO ===== */
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .form-card {
            background: #FFFFFF;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            border-radius: 4px;
            overflow: hidden;
        }
        .form-card .titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 24px 8px 24px;
            font-size: 26px;
            font-weight: 600;
            color: #000;
        }
        .form-card .titulo svg {
            width: 40px;
            height: 40px;
            fill: #1C1B1F;
        }
        .form-card .dados-chamado {
            background: #F5F7FC;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 24px;
            font-size: 16px;
            color: #3B73A7;
            font-weight: 400;
        }
        .form-card .campo {
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-card .campo label {
            font-weight: 600;
            font-size: 13px;
            color: #000;
        }
        .form-card .campo input,
        .form-card .campo select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        .form-card .campo .aviso {
            font-size: 11px;
            color: #d32f2f;
            margin-top: 2px;
        }
        .form-card .campo .dica {
            font-size: 11px;
            color: #555;
            margin-top: 2px;
        }
        .form-card .campo-radio {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding-top: 4px;
        }
        .form-card .campo-radio label {
            font-weight: 400;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .form-card .campo-radio input[type="radio"] {
            accent-color: #5B5083;
            width: 16px;
            height: 16px;
        }
        .form-card .acoes {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }
        .btn-enviar {
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-enviar:hover {
            background: #f0f0f0;
        }
        /* ===== RESPONSIVO ===== */
        @media (max-width: 480px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .requisicoes .item span { display: none; }
            .menu-lateral .recolher span { display: none; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL ===== -->
<div class="menu-lateral">
    <div class="requisicoes">
        <a href="../dashboard.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </a>
        <a href="../meus-chamados.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>FAQ</span>
        </div>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            <span>Reservas</span>
        </div>
    </div>
    <div class="recolher">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/></svg>
        <span>Recolher Menu</span>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços / Ativar Acesso de Usuário</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <div class="form-card">
            <!-- Título -->
            <div class="titulo">
                <svg viewBox="0 0 24 24"><path d="M20 8h-2v2h2v10H4V10h2V8H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/><path d="M12 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm-2-6V5c0-1.1.9-2 2-2s2 .9 2 2v3h-2V5c0-.6-.4-1-1-1s-1 .4-1 1v3h-2z"/></svg>
                Ativar Acesso de Usuário
            </div>
            <div class="dados-chamado">Dados do Chamado</div>

            <!-- Tipo de Usuário -->
            <div class="campo">
                <label>Tipo de Usuário *</label>
                <div class="campo-radio">
                    <label><input type="radio" name="tipo" value="servidor" checked /> Servidor</label>
                    <label><input type="radio" name="tipo" value="estagiario" /> Estagiário</label>
                    <label><input type="radio" name="tipo" value="residente" /> Residente</label>
                    <label><input type="radio" name="tipo" value="tercerizado" /> Terceirizado</label>
                </div>
            </div>

            <!-- Nome Completo -->
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite o nome completo" />
            </div>

            <!-- Registro / Vínculo (visível para servidor e residente) -->
            <div class="campo" id="campoRegistro">
                <label for="registro">Registro / Vínculo</label>
                <input type="text" id="registro" placeholder="Digite o registro ou vínculo" />
            </div>

            <!-- RG (visível para estagiário e terceirizado) -->
            <div class="campo" id="campoRG" style="display: none;">
                <label for="rg">RG</label>
                <input type="text" id="rg" placeholder="Digite o RG" />
                <div class="aviso">⚠️ Apenas para consultas, sem alterações.</div>
            </div>

            <!-- Login de Usuário -->
            <div class="campo">
                <label for="login">Login de Usuário</label>
                <input type="text" id="login" placeholder="Digite o login" />
            </div>

            <!-- Justificativa (fixa) -->
            <div class="campo">
                <label for="justificativa">Justificativa</label>
                <input type="text" id="justificativa" placeholder="Digite a justificativa" />
            </div>

            <!-- Justificativa extra para terceirizado (visível apenas se selecionado) -->
            <div class="campo" id="campoJustExtra" style="display: none;">
                <label for="justExtra">Justificativa adicional (Terceirizado)</label>
                <input type="text" id="justExtra" placeholder="Justificativa específica para terceirizado" />
            </div>

            <!-- Botão Enviar -->
            <div class="acoes">
                <button class="btn-enviar" id="btnEnviar">Enviar</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== Elementos =====
    const radios = document.querySelectorAll('input[name="tipo"]');
    const campoRegistro = document.getElementById('campoRegistro');
    const campoRG = document.getElementById('campoRG');
    const campoJustExtra = document.getElementById('campoJustExtra');

    // ===== Função para alternar visibilidade dos campos =====
    function atualizarCampos() {
        const tipoSelecionado = document.querySelector('input[name="tipo"]:checked');
        if (!tipoSelecionado) return;
        const valor = tipoSelecionado.value;

        // Servidor ou Residente → mostra Registro/Vínculo, esconde RG
        if (valor === 'servidor' || valor === 'residente') {
            campoRegistro.style.display = 'flex';
            campoRG.style.display = 'none';
            campoJustExtra.style.display = 'none';
        }
        // Estagiário → mostra RG (com aviso), esconde Registro e justificativa extra
        else if (valor === 'estagiario') {
            campoRegistro.style.display = 'none';
            campoRG.style.display = 'flex';
            campoJustExtra.style.display = 'none';
        }
        // Terceirizado → mostra RG e Justificativa extra
        else if (valor === 'tercerizado') {
            campoRegistro.style.display = 'none';
            campoRG.style.display = 'flex';
            campoJustExtra.style.display = 'flex';
        }
    }

    // ===== Evento de mudança nos radios =====
    radios.forEach(radio => {
        radio.addEventListener('change', atualizarCampos);
    });

    // ===== Inicializa com o estado padrão (servidor) =====
    atualizarCampos();

    // ===== Evento de envio =====
    document.getElementById('btnEnviar').addEventListener('click', function(e) {
        e.preventDefault();
        const tipo = document.querySelector('input[name="tipo"]:checked');
        const nome = document.getElementById('nome').value.trim();
        const login = document.getElementById('login').value.trim();
        const justificativa = document.getElementById('justificativa').value.trim();

        let registro = '';
        let rg = '';
        let justExtra = '';

        if (!tipo) {
            alert('Selecione um tipo de usuário.');
            return;
        }
        if (!nome || !login || !justificativa) {
            alert('Preencha Nome, Login e Justificativa.');
            return;
        }

        const tipoValor = tipo.value;
        if (tipoValor === 'servidor' || tipoValor === 'residente') {
            registro = document.getElementById('registro').value.trim();
            if (!registro) {
                alert('Preencha o campo Registro / Vínculo.');
                return;
            }
        } else if (tipoValor === 'estagiario' || tipoValor === 'tercerizado') {
            rg = document.getElementById('rg').value.trim();
            if (!rg) {
                alert('Preencha o campo RG.');
                return;
            }
            if (tipoValor === 'tercerizado') {
                justExtra = document.getElementById('justExtra').value.trim();
                if (!justExtra) {
                    alert('Preencha a Justificativa adicional para terceirizado.');
                    return;
                }
            }
        }

        alert(`Chamado de ativação de acesso enviado com sucesso!\n\nTipo: ${tipoValor}\nNome: ${nome}\nLogin: ${login}\n${registro ? 'Registro: '+registro : ''}${rg ? 'RG: '+rg : ''}\nJustificativa: ${justificativa}\n${justExtra ? 'Just. extra: '+justExtra : ''}`);
    });
</script>

</body>
</html>
