<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inclusão de Novo Usuário - GLPI SIGPEC</title>
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ===== MENU LATERAL ===== */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 22px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 17px;
            width: 118px;
        }
        .menu-lateral .requisicoes .item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .menu-lateral .requisicoes .item svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
        }
        /* ===== CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 13px;
            background: #FFFFFF;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 20px;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }
        /* ===== FORMULÁRIO ===== */
        .form-container {
            background: #FFFFFF;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            border-radius: 4px;
            padding: 20px 30px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }
        .form-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-header h2 {
            font-size: 26px;
            font-weight: 600;
            color: #000;
            margin: 0;
        }
        .form-header .icon {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-header .icon svg {
            width: 30px;
            height: 30px;
            fill: #1C1B1F;
        }
        .dados-chamado {
            background: #F5F7FC;
            border: 1px solid rgba(0,0,0,0.1);
            padding: 8px 20px;
            margin: 0 -20px 20px -20px;
            font-size: 16px;
            color: #3B73A7;
            font-weight: 400;
        }
        .campo {
            margin-bottom: 18px;
        }
        .campo label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #000;
            margin-bottom: 4px;
        }
        .campo label .info {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #D9D9D9;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 12px;
            color: #1C1B1F;
            margin-left: 4px;
            cursor: default;
        }
        .campo input, .campo select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            background: #FFFFFF;
            height: 30px;
        }
        .campo select[multiple] {
            height: auto;
            min-height: 80px;
            padding: 4px;
        }
        .campo select[multiple] option {
            padding: 4px 8px;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 4px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 400;
            font-size: 13px;
            color: #000;
            cursor: pointer;
        }
        .radio-group input[type="radio"] {
            width: auto;
            height: auto;
            margin-right: 2px;
        }
        .aviso {
            background: #FFF3CD;
            border-left: 4px solid #FFC107;
            padding: 6px 12px;
            font-size: 12px;
            color: #856404;
            margin-top: 4px;
            border-radius: 2px;
        }
        .campo-extra {
            display: none;
        }
        .campo-extra.ativo {
            display: block;
        }
        .bt-enviar {
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 15px;
            color: #000;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .bt-enviar:hover {
            background: #f0f0f0;
        }
        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .form-container { padding: 15px; }
            .dados-chamado { margin: 0 -15px 15px -15px; }
        }
        @media (max-width: 480px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .requisicoes .item span { display: none; }
            .menu-lateral .recolher span { display: none; }
            .form-header h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL ===== -->
<div class="menu-lateral">
    <div class="requisicoes">
        <a href="../dashboard.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </a>
        <a href="../meus-chamados.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>FAQ</span>
        </div>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            <span>Reservas</span>
        </div>
    </div>
    <div class="recolher">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/></svg>
        <span>Recolher Menu</span>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços /</span>
            <span style="color:#000;">Inclusão de Novo Usuário</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <div class="form-header">
            <h2>Inclusão de Novo Usuário</h2>
            <div class="icon">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
        </div>

        <div class="dados-chamado">Dados do Chamado</div>

        <!-- Tipo de Usuário -->
        <div class="campo">
            <label>Tipo de Usuário * <span class="info">ⓘ</span></label>
            <div class="radio-group" id="tipoUsuario">
                <label><input type="radio" name="tipo" value="servidor" checked /> Servidor</label>
                <label><input type="radio" name="tipo" value="estagiario" /> Estagiário</label>
                <label><input type="radio" name="tipo" value="residente" /> Residente</label>
                <label><input type="radio" name="tipo" value="tercerizado" /> Terceirizado</label>
            </div>
        </div>

        <!-- Nome Completo (sempre visível) -->
        <div class="campo">
            <label>Nome Completo <span class="info">ⓘ</span></label>
            <input type="text" id="nomeCompleto" placeholder="Digite o nome completo" />
        </div>

        <!-- Campo dinâmico: Registro/Vínculo ou RG -->
        <div class="campo" id="campoRegistro">
            <label id="labelRegistro">Registro / Vínculo <span class="info">ⓘ</span></label>
            <input type="text" id="registro" placeholder="Digite o registro ou vínculo" />
        </div>

        <!-- Aviso para estagiário (aparece dinamicamente) -->
        <div class="aviso" id="avisoEstagiario" style="display: none;">
            ⚠️ Apenas para consultas, sem alterações.
        </div>

        <!-- Campo extra para Terceirizado: Justificativa -->
        <div class="campo campo-extra" id="campoJustificativaExtra">
            <label>Justificativa <span class="info">ⓘ</span></label>
            <input type="text" id="justificativaExtra" placeholder="Justificativa para terceirizado" />
        </div>

        <!-- Padrão de Acesso (múltipla seleção) -->
        <div class="campo">
            <label>Padrão de Acesso <span class="info">ⓘ</span></label>
            <select multiple id="padraoAcesso">
                <!-- As opções serão inseridas via JavaScript -->
            </select>
            <small style="color:#666; font-size:11px;">Segure Ctrl (ou Cmd) para selecionar múltiplos</small>
        </div>

        <!-- Perfil de Setor (única seleção) -->
        <div class="campo">
            <label>Perfil de Setor <span class="info">ⓘ</span></label>
            <select id="perfilSetor">
                <!-- Opções via JavaScript -->
            </select>
        </div>

        <button class="bt-enviar" id="btnEnviar">Enviar</button>
    </div>

</div>

<script>
    // ===== DADOS =====
    const padroesAcesso = [
        'BASICO',
        'CONSULTA_GERAL',
        'Ergon',
        'AHM_PARCELAMEN',
        'CADASTRO',
        'DEBITOS',
        'FOLHA_UNIDADES',
        'APOS/EXONER',
        'SEG HOLERITE',
        'AUX_FUNERAL',
        'ACESSO_WEB'
    ];

    const perfisSetor = [
        'CMSP',
        'GERAL',
        'IPREM',
        'PENSIONISTA',
        'SFMSP',
        'TCMSP',
        'AHM_GERAL',
        'MUNICIPALIZADOS',
        'SMS',
        'IPREM_APOS',
        'APOS_SME',
        'SME',
        'AFASTADOS',
        'AHM-JSH',
        'AMLURB'
    ];

    // ===== POPULAR SELECTS =====
    const padraoSelect = document.getElementById('padraoAcesso');
    padroesAcesso.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        padraoSelect.appendChild(opt);
    });

    const perfilSelect = document.getElementById('perfilSetor');
    perfisSetor.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        perfilSelect.appendChild(opt);
    });

    // ===== CONTROLE DINÂMICO DOS CAMPOS =====
    const radios = document.querySelectorAll('input[name="tipo"]');
    const campoRegistro = document.getElementById('campoRegistro');
    const labelRegistro = document.getElementById('labelRegistro');
    const inputRegistro = document.getElementById('registro');
    const avisoEstagiario = document.getElementById('avisoEstagiario');
    const campoJustificativaExtra = document.getElementById('campoJustificativaExtra');

    function atualizarCampos() {
        const tipoSelecionado = document.querySelector('input[name="tipo"]:checked').value;

        // Resetar visibilidade
        campoRegistro.style.display = 'block';
        avisoEstagiario.style.display = 'none';
        campoJustificativaExtra.classList.remove('ativo');

        // Servidor ou Residente: Registro/Vínculo
        if (tipoSelecionado === 'servidor' || tipoSelecionado === 'residente') {
            labelRegistro.textContent = 'Registro / Vínculo';
            inputRegistro.placeholder = 'Digite o registro ou vínculo';
            campoRegistro.style.display = 'block';
        }
        // Estagiário: RG + aviso
        else if (tipoSelecionado === 'estagiario') {
            labelRegistro.textContent = 'RG';
            inputRegistro.placeholder = 'Digite o RG';
            campoRegistro.style.display = 'block';
            avisoEstagiario.style.display = 'block';
        }
        // Terceirizado: RG + Justificativa extra
        else if (tipoSelecionado === 'tercerizado') {
            labelRegistro.textContent = 'RG';
            inputRegistro.placeholder = 'Digite o RG';
            campoRegistro.style.display = 'block';
            campoJustificativaExtra.classList.add('ativo');
        }
    }

    // Adicionar evento a todos os radios
    radios.forEach(radio => {
        radio.addEventListener('change', atualizarCampos);
    });

    // Executar ao carregar para estado inicial
    atualizarCampos();

    // ===== BOTÃO ENVIAR (apenas alerta) =====
    document.getElementById('btnEnviar').addEventListener('click', function(e) {
        e.preventDefault();

        const tipo = document.querySelector('input[name="tipo"]:checked').value;
        const nome = document.getElementById('nomeCompleto').value.trim();
        const registro = document.getElementById('registro').value.trim();
        const padroes = Array.from(document.getElementById('padraoAcesso').selectedOptions).map(o => o.value);
        const perfil = document.getElementById('perfilSetor').value;
        let justificativaExtra = '';
        if (tipo === 'tercerizado') {
            justificativaExtra = document.getElementById('justificativaExtra').value.trim();
        }

        // Validação simples
        if (!nome) {
            alert('Preencha o Nome Completo.');
            return;
        }
        if (!registro) {
            alert('Preencha o campo de ' + (tipo === 'estagiario' || tipo === 'tercerizado' ? 'RG' : 'Registro/Vínculo'));
            return;
        }
        if (padroes.length === 0) {
            alert('Selecione pelo menos um Padrão de Acesso.');
            return;
        }
        if (!perfil) {
            alert('Selecione um Perfil de Setor.');
            return;
        }

        // Simulação de envio
        alert('Chamado criado com sucesso!\n\n' +
            'Tipo: ' + tipo + '\n' +
            'Nome: ' + nome + '\n' +
            (tipo === 'estagiario' || tipo === 'tercerizado' ? 'RG: ' : 'Registro/Vínculo: ') + registro + '\n' +
            'Padrões: ' + padroes.join(', ') + '\n' +
            'Perfil: ' + perfil + '\n' +
            (justificativaExtra ? 'Justificativa: ' + justificativaExtra : ''));
    });
</script>

</body>
</html>
