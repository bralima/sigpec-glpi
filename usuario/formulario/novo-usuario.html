<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inclusão de Novo Usuário</title>
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ===== MENU LATERAL ===== */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 22px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 17px;
            width: 118px;
        }
        .menu-lateral .requisicoes .item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .menu-lateral .requisicoes .item svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
        }
        /* ===== CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 13px;
            background: #FFFFFF;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 20px;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }
        /* ===== FORMULÁRIO ===== */
        .form-container {
            background: #FFFFFF;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            border-radius: 4px;
            overflow: hidden;
        }
        .form-header {
            background: #F5F7FC;
            padding: 10px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .form-header h3 {
            font-size: 16px;
            color: #3B73A7;
            font-weight: 400;
        }
        .form-body {
            padding: 20px 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #000;
            margin-bottom: 4px;
        }
        .form-group label .info-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #D9D9D9;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 12px;
            color: #1C1B1F;
            margin-left: 4px;
            cursor: default;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px 25px;
            margin-top: 4px;
        }
        .radio-group label {
            font-weight: 400;
            font-size: 13px;
            color: #000;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .radio-group input[type="radio"] {
            accent-color: #5B5083;
            width: 16px;
            height: 16px;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        .form-control:focus {
            outline: none;
            border-color: #3B73A7;
        }
        select.form-control[multiple] {
            height: 100px;
            padding: 6px;
        }
        select.form-control[multiple] option {
            padding: 4px 8px;
        }
        .help-text {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .help-text .warning {
            color: #D9534F;
            font-weight: 600;
        }
        .btn-enviar {
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 15px;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-enviar:hover {
            background: #f0f0f0;
        }
        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .requisicoes .item span { display: none; }
            .menu-lateral .recolher span { display: none; }
            .form-body { padding: 15px; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL ===== -->
<div class="menu-lateral">
    <div class="requisicoes">
        <a href="dashboard.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </a>
        <a href="meus-chamados.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>FAQ</span>
        </div>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            <span>Reservas</span>
        </div>
    </div>
    <div class="recolher">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/></svg>
        <span>Recolher Menu</span>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços / Inclusão de Novo Usuário</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <div class="form-header">
            <h3>Dados do Chamado</h3>
        </div>
        <div class="form-body">
            <form id="formNovoUsuario">

                <!-- Tipo de Usuário -->
                <div class="form-group">
                    <label>
                        Tipo de Usuário *
                        <span class="info-icon" title="Selecione o tipo de usuário">ⓘ</span>
                    </label>
                    <div class="radio-group" id="tipoUsuario">
                        <label><input type="radio" name="tipo" value="servidor" checked /> Servidor</label>
                        <label><input type="radio" name="tipo" value="estagiario" /> Estagiário</label>
                        <label><input type="radio" name="tipo" value="residente" /> Residente</label>
                        <label><input type="radio" name="tipo" value="tercerizado" /> Terceirizado</label>
                    </div>
                </div>

                <!-- Nome Completo -->
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" class="form-control" id="nomeCompleto" placeholder="Digite o nome completo" />
                </div>

                <!-- Registro / Vínculo ou RG (dinâmico) -->
                <div class="form-group" id="campoRegistro">
                    <label id="labelRegistro">Registro / Vínculo</label>
                    <input type="text" class="form-control" id="registro" placeholder="Digite o número de registro" />
                    <div class="help-text" id="helpRegistro"></div>
                </div>

                <!-- Padrão de Acesso (múltipla escolha) -->
                <div class="form-group">
                    <label>
                        Padrão de Acesso
                        <span class="info-icon" title="Selecione um ou mais padrões">ⓘ</span>
                    </label>
                    <select class="form-control" id="padraoAcesso" multiple>
                        <!-- as opções serão inseridas via JavaScript -->
                    </select>
                    <div class="help-text">Segure Ctrl (ou Cmd) para selecionar múltiplos.</div>
                </div>

                <!-- Justificativa (aparece apenas para terceirizado) -->
                <div class="form-group" id="campoJustificativa" style="display:none;">
                    <label>Justificativa</label>
                    <textarea class="form-control" id="justificativa" rows="2" placeholder="Descreva a justificativa"></textarea>
                </div>

                <!-- Perfil de Setor (único) -->
                <div class="form-group">
                    <label>
                        Perfil de Setor
                        <span class="info-icon" title="Selecione um perfil">ⓘ</span>
                    </label>
                    <select class="form-control" id="perfilSetor">
                        <!-- opções via JavaScript -->
                    </select>
                </div>

                <button type="button" class="btn-enviar" id="btnEnviar">Enviar</button>
            </form>
        </div>
    </div>

</div>

<script>
    (function() {
        // ===== DADOS =====
        const padroes = [
            'BASICO',
            'CONSULTA_GERAL',
            'Ergon',
            'AHM_PARCELAMEN',
            'CADASTRO',
            'DEBITOS',
            'FOLHA_UNIDADES',
            'APOS/EXONER',
            'SEG HOLERITE',
            'AUX_FUNERAL',
            'ACESSO_WEB'
        ];

        const perfis = [
            'CMSP',
            'GERAL',
            'IPREM',
            'PENSIONISTA',
            'SFMSP',
            'TCMSP',
            'AHM_GERAL',
            'MUNICIPALIZADOS',
            'SMS',
            'IPREM_APOS',
            'APOS_SME',
            'SME',
            'AFASTADOS',
            'AHM-JSH',
            'AMLURB'
        ];

        // ===== REFERÊNCIAS =====
        const tipoRadios = document.querySelectorAll('input[name="tipo"]');
        const campoRegistro = document.getElementById('campoRegistro');
        const labelRegistro = document.getElementById('labelRegistro');
        const inputRegistro = document.getElementById('registro');
        const helpRegistro = document.getElementById('helpRegistro');
        const campoJustificativa = document.getElementById('campoJustificativa');
        const inputJustificativa = document.getElementById('justificativa');
        const selectPadrao = document.getElementById('padraoAcesso');
        const selectPerfil = document.getElementById('perfilSetor');
        const btnEnviar = document.getElementById('btnEnviar');

        // ===== POPULAR SELECTS =====
        function popularSelect(select, opcoes) {
            select.innerHTML = '';
            opcoes.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                select.appendChild(opt);
            });
        }
        popularSelect(selectPadrao, padroes);
        popularSelect(selectPerfil, perfis);

        // ===== FUNÇÃO PARA ATUALIZAR CAMPOS CONFORME TIPO =====
        function atualizarCampos() {
            let tipoSelecionado = null;
            for (let radio of tipoRadios) {
                if (radio.checked) {
                    tipoSelecionado = radio.value;
                    break;
                }
            }

            // Limpa ajuda
            helpRegistro.innerHTML = '';
            helpRegistro.style.color = '#666';

            // Caso Servidor ou Residente
            if (tipoSelecionado === 'servidor' || tipoSelecionado === 'residente') {
                labelRegistro.textContent = 'Registro / Vínculo';
                inputRegistro.placeholder = 'Digite o número de registro';
                helpRegistro.textContent = '';
                // Esconde justificativa
                campoJustificativa.style.display = 'none';
                inputJustificativa.value = '';
            }
            // Caso Estagiário
            else if (tipoSelecionado === 'estagiario') {
                labelRegistro.textContent = 'RG';
                inputRegistro.placeholder = 'Digite o RG';
                helpRegistro.innerHTML = '<span class="warning">⚠️</span> Apenas para consultas, sem alterações.';
                helpRegistro.style.color = '#D9534F';
                campoJustificativa.style.display = 'none';
                inputJustificativa.value = '';
            }
            // Caso Terceirizado
            else if (tipoSelecionado === 'tercerizado') {
                labelRegistro.textContent = 'RG';
                inputRegistro.placeholder = 'Digite o RG';
                helpRegistro.textContent = '';
                campoJustificativa.style.display = 'block';
            }
        }

        // ===== EVENTOS =====
        tipoRadios.forEach(radio => {
            radio.addEventListener('change', atualizarCampos);
        });

        // ===== BOTÃO ENVIAR =====
        btnEnviar.addEventListener('click', function() {
            const tipo = document.querySelector('input[name="tipo"]:checked');
            const nome = document.getElementById('nomeCompleto').value.trim();
            const registro = document.getElementById('registro').value.trim();
            const padroesSelecionados = Array.from(selectPadrao.selectedOptions).map(opt => opt.value);
            const perfil = selectPerfil.value;
            const justificativa = document.getElementById('justificativa').value.trim();

            let mensagem = '=== DADOS DO FORMULÁRIO ===\n';
            mensagem += `Tipo: ${tipo ? tipo.value : 'não selecionado'}\n`;
            mensagem += `Nome: ${nome || '(vazio)'}\n`;
            mensagem += `Registro/RG: ${registro || '(vazio)'}\n`;
            mensagem += `Padrões: ${padroesSelecionados.length ? padroesSelecionados.join(', ') : 'nenhum'}\n`;
            mensagem += `Perfil: ${perfil || 'nenhum'}\n`;
            if (tipo && tipo.value === 'tercerizado') {
                mensagem += `Justificativa: ${justificativa || '(vazio)'}\n`;
            }
            alert(mensagem);
        });

        // ===== INICIALIZAR =====
        atualizarCampos();

    })();
</script>

</body>
</html>
