        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(145deg, #e8ecf1 0%, #d5dce6 100%);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== MENU LATERAL (mesmo estilo) ===== */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 10px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }
        .menu-lateral .categoria {
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            transition: 0.1s;
        }
        .menu-lateral .categoria:hover {
            background: rgba(255,255,255,0.08);
        }
        .menu-lateral .categoria .icone {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
            flex-shrink: 0;
        }
        .menu-lateral .categoria .seta {
            margin-left: auto;
            transition: transform 0.2s;
            font-size: 12px;
        }
        .menu-lateral .categoria .seta.aberta {
            transform: rotate(90deg);
        }
        .menu-lateral .subitens {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 26px;
            gap: 4px;
            width: 100%;
            margin-bottom: 4px;
        }
        .menu-lateral .subitens.aberto {
            display: flex;
        }
        .menu-lateral .subitens .subitem {
            color: #FFFFFF;
            font-size: 12px;
            line-height: 14px;
            text-decoration: none;
            padding: 3px 0;
            width: 100%;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .menu-lateral .subitens .subitem:hover {
            background: rgba(255,255,255,0.1);
            padding-left: 4px;
        }
        .menu-lateral .subitens .subitem.ativo {
            font-weight: 600;
            background: rgba(255,255,255,0.15);
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
            width: 100%;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* ===== CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 24px 24px;
            height: 100vh;
            overflow-y: auto;
        }

        /* Cabeçalho */
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; fill: #1A397A; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }

        /* ===== BARRA DE PESQUISA E FILTROS ===== */
        .barra-ferramentas {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #FFFFFF;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            flex-shrink: 0;
            align-items: center;
        }
        .barra-ferramentas input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1px solid #D9DBDE;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Open Sans', sans-serif;
        }
        .barra-ferramentas input[type="text"]:focus {
            border-color: #1A397A;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,57,122,0.15);
        }
        .barra-ferramentas select {
            padding: 8px 12px;
            border: 1px solid #D9DBDE;
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
        }
        .barra-ferramentas .badge-total {
            background: #1A397A;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-left: auto;
        }

        /* ===== TABELA ===== */
        .tabela-wrapper {
            flex: 1;
            overflow-y: auto;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 0;
        }
        .tabela-padroes {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .tabela-padroes th {
            background: #F2F3F4;
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: #1A397A;
            border-bottom: 2px solid #D9D9D9;
            position: sticky;
            top: 0;
            z-index: 2;
            white-space: nowrap;
        }
        .tabela-padroes td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            color: #000;
            vertical-align: middle;
        }
        .tabela-padroes tr:last-child td {
            border-bottom: none;
        }
        .tabela-padroes tr:nth-child(even) {
            background: #FFFFFF;
        }
        .tabela-padroes tr:nth-child(odd) {
            background: #F9FAFB;
        }
        .tabela-padroes .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-ativo {
            background: #28a745;
            color: #fff;
        }
        .status-inativo {
            background: #dc3545;
            color: #fff;
        }
        .tabela-padroes .acoes button {
            background: none;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-right: 4px;
            transition: 0.1s;
        }
        .tabela-padroes .acoes button:hover {
            background: #E7E9F3;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .menu-lateral { width: 60px; padding: 20px 10px; gap: 40px; }
            .menu-lateral .categoria span:not(.seta) { display: none; }
            .menu-lateral .subitens { padding-left: 10px; }
            .menu-lateral .subitens .subitem span { display: none; }
            .menu-lateral .recolher span { display: none; }
            .menu-lateral .categoria .seta { display: none; }
            .conteudo { padding: 12px; }
            .barra-ferramentas { flex-direction: column; align-items: stretch; }
            .barra-ferramentas .badge-total { margin-left: 0; text-align: center; }
            .tabela-padroes { font-size: 11px; }
            .tabela-padroes th, .tabela-padroes td { padding: 6px 8px; }
        }
        @media (max-width: 480px) {
            .cabecalho .breadcrumb span { font-size: 12px; }

    function gerarDescricao(nome) {
        const descs = [
            `Acesso para ${nome} – permite visualização e edição.`,
            `Perfil de ${nome} – consulta e atualização de dados.`,
            `Funcionalidade ${nome} – restrita a gestores.`,
            `Módulo ${nome} – integração com sistemas internos.`,
            `${nome} – controle de permissões específicas.`
        ];
        return descs[Math.floor(Math.random() * descs.length)];
    }

    function gerarNumero(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Lista de siglas de secretarias para simular
    const siglas = ['SEGES','SMS','SME','SMT','SMDHC','SMDU','SES','SMC','SMJ','SMSP','SMO','SMSU','SMG','SMPG','SMTU','SMP'];

    function gerarDados() {
        return listaPadroes.map(nome => {
            // Status: ~70% ativo, 30% inativo
            const ativo = Math.random() > 0.3;
            const qtdeSecretarias = gerarNumero(0, 16);
            const qtdeUsuarios = gerarNumero(0, 500);
            // Secretarias permitidas – pode ser "Todas" ou um número
            const permitidas = Math.random() > 0.4 ? 'Todas' : gerarNumero(1, 16);
            return {
                nome: nome,
                descricao: gerarDescricao(nome),
                secretariasAcesso: qtdeSecretarias,
                usuarios: qtdeUsuarios,
                secretariasPermitidas: permitidas,
                status: ativo ? 'Ativo' : 'Inativo'
            };
        });
    }

    // ============================================================
    // RENDERIZAÇÃO DA TABELA COM FILTROS
    // ============================================================
    let dadosCompletos = [];

    function renderizarTabela(dados) {
        const tbody = document.getElementById('corpoTabela');
        const total = document.getElementById('totalPadroes');
        if (!tbody) return;

        total.textContent = `${dados.length} padrões`;

        let html = '';
        dados.forEach(p => {
            const statusClass = p.status === 'Ativo' ? 'status-ativo' : 'status-inativo';
            html += `
                <tr>
                    <td><strong>${p.nome}</strong></td>
                    <td>${p.descricao}</td>
                    <td>${p.secretariasAcesso}</td>
                    <td>${p.usuarios}</td>
                    <td>${p.secretariasPermitidas}</td>
                    <td><span class="status-badge ${statusClass}">${p.status}</span></td>
                    <td class="acoes">
                        <button title="Visualizar">👁️</button>
                        <button title="Editar">✏️</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function filtrarDados() {
        const busca = document.getElementById('buscaPadrao').value.toLowerCase().trim();
        const statusFiltro = document.getElementById('filtroStatus').value;

        let filtrados = dadosCompletos;

        if (busca) {
            filtrados = filtrados.filter(p => p.nome.toLowerCase().includes(busca));
        }
        if (statusFiltro) {
            filtrados = filtrados.filter(p => p.status === statusFiltro);
        }

        renderizarTabela(filtrados);
    }

    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        dadosCompletos = gerarDados();
        renderizarTabela(dadosCompletos);

        // Eventos de busca e filtro
        document.getElementById('buscaPadrao').addEventListener('input', filtrarDados);
        document.getElementById('filtroStatus').addEventListener('change', filtrarDados);
    });

    // ============================================================
    // INTERAÇÃO: Menu lateral (toggle)
    // ============================================================
    document.querySelectorAll('.categoria[data-target]').forEach(cat => {
        cat.addEventListener('click', function(e) {
            const targetId = this.dataset.target;
            const sub = document.getElementById(targetId);
            if (sub) {
                sub.classList.toggle('aberto');
                const seta = this.querySelector('.seta');
                if (seta) seta.classList.toggle('aberta');
            }
        });
    });

    document.querySelector('.recolher')?.addEventListener('click', function() {
        document.querySelectorAll('.subitens').forEach(s => s.classList.remove('aberto'));
        document.querySelectorAll('.seta').forEach(s => s.classList.remove('aberta'));
    });
</script>

</body>
</html>
