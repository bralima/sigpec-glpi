<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentos - GLPI SIGPEC</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(145deg, #e8ecf1 0%, #d5dce6 100%);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== MENU LATERAL (mesmo estilo) ===== */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 10px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }
        .menu-lateral .categoria {
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            transition: 0.1s;
        }
        .menu-lateral .categoria:hover {
            background: rgba(255,255,255,0.08);
        }
        .menu-lateral .categoria .icone {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
            flex-shrink: 0;
        }
        .menu-lateral .categoria .seta {
            margin-left: auto;
            transition: transform 0.2s;
            font-size: 12px;
        }
        .menu-lateral .categoria .seta.aberta {
            transform: rotate(90deg);
        }
        .menu-lateral .subitens {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 26px;
            gap: 4px;
            width: 100%;
            margin-bottom: 4px;
        }
        .menu-lateral .subitens.aberto {
            display: flex;
        }
        .menu-lateral .subitens .subitem {
            color: #FFFFFF;
            font-size: 12px;
            line-height: 14px;
            text-decoration: none;
            padding: 3px 0;
            width: 100%;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .menu-lateral .subitens .subitem:hover {
            background: rgba(255,255,255,0.1);
            padding-left: 4px;
        }
        .menu-lateral .subitens .subitem.ativo {
            font-weight: 600;
            background: rgba(255,255,255,0.15);
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
            width: 100%;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* ===== CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 24px 24px;
            height: 100vh;
            overflow-y: auto;
        }

        /* Cabeçalho */
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; fill: #1A397A; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }

        /* ===== BARRA DE FERRAMENTAS ===== */
        .barra-ferramentas {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #FFFFFF;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            flex-shrink: 0;
            align-items: center;
        }
        .barra-ferramentas input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1px solid #D9DBDE;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Open Sans', sans-serif;
        }
        .barra-ferramentas input[type="text"]:focus {
            border-color: #1A397A;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,57,122,0.15);
        }
        .barra-ferramentas select {
            padding: 8px 12px;
            border: 1px solid #D9DBDE;
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
        }
        .barra-ferramentas .badge-total {
            background: #1A397A;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-left: auto;
        }

        /* ===== TABELA ===== */
        .tabela-wrapper {
            flex: 1;
            overflow-y: auto;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 0;
        }
        .tabela-docs {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .tabela-docs th {
            background: #F2F3F4;
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: #1A397A;
            border-bottom: 2px solid #D9D9D9;
            position: sticky;
            top: 0;
            z-index: 2;
            white-space: nowrap;
        }
        .tabela-docs td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            color: #000;
            vertical-align: middle;
        }
        .tabela-docs tr:last-child td {
            border-bottom: none;
        }
        .tabela-docs tr:nth-child(even) {
            background: #FFFFFF;
        }
        .tabela-docs tr:nth-child(odd) {
            background: #F9FAFB;
        }
        .tabela-docs .tipo-mime {
            font-size: 12px;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .tabela-docs .entidade-badge {
            font-size: 12px;
            background: #d4edda;
            padding: 2px 8px;
            border-radius: 12px;
            color: #155724;
        }
        .tabela-docs .acoes button {
            background: none;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            margin-right: 4px;
            transition: 0.1s;
        }
        .tabela-docs .acoes button:hover {
            background: #E7E9F3;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .menu-lateral { width: 60px; padding: 20px 10px; gap: 40px; }
            .menu-lateral .categoria span:not(.seta) { display: none; }
            .menu-lateral .subitens { padding-left: 10px; }
            .menu-lateral .subitens .subitem span { display: none; }
            .menu-lateral .recolher span { display: none; }
            .menu-lateral .categoria .seta { display: none; }
            .conteudo { padding: 12px; }
            .barra-ferramentas { flex-direction: column; align-items: stretch; }
            .barra-ferramentas .badge-total { margin-left: 0; text-align: center; }
            .tabela-docs { font-size: 11px; }
            .tabela-docs th, .tabela-docs td { padding: 6px 8px; }
        }
        @media (max-width: 480px) {
            .cabecalho .breadcrumb span { font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL ===== -->
<div class="menu-lateral">
    <div class="requisicoes">
        <!-- Assistência -->
        <div class="categoria" data-target="sub-assistencia">
            <svg class="icone" viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Assistência</span>
            <span class="seta">▶</span>
        </div>
        <div class="subitens" id="sub-assistencia">
            <a href="../assistencia/chamados.html" class="subitem"><span>Chamados</span></a>
            <a href="../assistencia/criar-chamado.html" class="subitem"><span>Criar Chamado</span></a>
        </div>

        <!-- Gerência -->
        <div class="categoria" data-target="sub-gerencia">
            <svg class="icone" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Gerência</span>
            <span class="seta aberta">▼</span>
        </div>
        <div class="subitens aberto" id="sub-gerencia">
            <a href="padrao-acesso.html" class="subitem"><span>Padrão de Acesso</span></a>
            <a href="perfil-setor.html" class="subitem"><span>Perfil de Setor</span></a>
            <a href="docs.html" class="subitem ativo"><span>Documentos</span></a>
        </div>

        <!-- Administração -->
        <div class="categoria" data-target="sub-administracao">
            <svg class="icone" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 2c4.41 0 8 3.59 8 8s-3.59 8-8 8-8-3.59-8-8 3.59-8 8-8zm-1 12h2v-2h-2v2zm0-4h2V7h-2v5z"/></svg>
            <span>Administração</span>
            <span class="seta">▶</span>
        </div>
        <div class="subitens" id="sub-administracao">
            <a href="../admin/usuarios.html" class="subitem"><span>Usuários</span></a>
            <a href="../admin/grupos.html" class="subitem"><span>Grupos</span></a>
            <a href="../admin/forms.html" class="subitem"><span>Formulários</span></a>
        </div>
    </div>

    <div class="recolher">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/></svg>
        <span>Recolher Menu</span>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span>Gerência /</span>
            <span style="color:#1A397A; font-weight:600;">Documentos</span>
        </div>
        <div class="usuario-dropdown">
            <span>Técnico</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Barra de ferramentas -->
    <div class="barra-ferramentas">
        <input type="text" id="buscaDoc" placeholder="🔍 Buscar documento..." />
        <select id="filtroEntidade">
            <option value="">Todas as entidades</option>
            <!-- As opções serão preenchidas via JS -->
        </select>
        <span class="badge-total" id="totalDocs">0 documentos</span>
    </div>

    <!-- Tabela -->
    <div class="tabela-wrapper">
        <table class="tabela-docs" id="tabelaDocs">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Entidade</th>
                    <th>Arquivo</th>
                    <th>Tipo MIME</th>
                    <th>Comentário</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ============================================================
    // DADOS MOCK – Documentos
    // ============================================================
    const secretarias = [
        'SEGES', 'SMS', 'SME', 'SMT', 'SMDHC', 'SMDU', 'SES', 'SMC', 
        'SMJ', 'SMSP', 'SMO', 'SMSU', 'SMG', 'SMPG', 'SMTU', 'SMP'
    ];

    const nomesDocumentos = [
        'Manual de Procedimentos', 'Regulamento Interno', 'Política de Acesso',
        'Instrução Normativa', 'Portaria nº 001', 'Decreto Municipal',
        'Guia do Usuário', 'Especificação Técnica', 'Termo de Referência',
        'Plano de Contingência', 'Relatório Anual', 'Ata de Reunião',
        'Contrato de Prestação', 'Projeto de Lei', 'Ofício Circular',
        'Comunicado Oficial', 'Formulário de Cadastro', 'Checklist de Segurança',
        'Manual do Sistema', 'Guia Rápido'
    ];

    const extensoes = ['pdf', 'docx', 'xlsx', 'ppt', 'odt', 'txt', 'csv', 'png', 'jpg'];
    const mimeTypes = [
        'application/pdf',
        'application/msword',
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        'application/vnd.ms-excel',
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        'application/vnd.ms-powerpoint',
        'application/vnd.openxmlformats-officedocument.presentationml.presentation',
        'text/plain',
        'text/csv',
        'image/png',
        'image/jpeg',
        'application/octet-stream'
    ];

    function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function randomNumber(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function gerarDocumentos(count) {
        const docs = [];
        for (let i = 0; i < count; i++) {
            const nome = randomItem(nomesDocumentos);
            const entidade = randomItem(secretarias);
            const ext = randomItem(extensoes);
            const arquivo = `${nome.replace(/\s/g, '_')}_${randomNumber(1,999)}.${ext}`;
            const mime = randomItem(mimeTypes);
            const comentarios = [
                'Documento atualizado em ' + new Date().toLocaleDateString(),
                'Versão revisada pelo comitê',
                'Aguardando aprovação',
                'Documento público',
                'Restrito à gestão',
                'Em fase de implementação',
                'Histórico de alterações anexo'
            ];
            const comentario = randomItem(comentarios);
            docs.push({ nome, entidade, arquivo, mime, comentario });
        }
        return docs;
    }

    // Gera 30 documentos
    let documentos = gerarDocumentos(30);

    // ============================================================
    // POPULAR FILTRO DE ENTIDADES
    // ============================================================
    function popularFiltroEntidades() {
        const select = document.getElementById('filtroEntidade');
        const entidades = [...new Set(documentos.map(d => d.entidade))].sort();
        // Mantém a opção "Todas as entidades"
        select.innerHTML = '<option value="">Todas as entidades</option>';
        entidades.forEach(ent => {
            const opt = document.createElement('option');
            opt.value = ent;
            opt.textContent = ent;
            select.appendChild(opt);
        });
    }

    // ============================================================
    // RENDERIZAÇÃO DA TABELA
    // ============================================================
    function renderizarTabela(dados) {
        const tbody = document.getElementById('corpoTabela');
        const total = document.getElementById('totalDocs');
        if (!tbody) return;

        total.textContent = `${dados.length} documentos`;

        let html = '';
        dados.forEach(d => {
            html += `
                <tr>
                    <td><strong>${d.nome}</strong></td>
                    <td><span class="entidade-badge">${d.entidade}</span></td>
                    <td><code style="background:#f0f0f0; padding:2px 6px; border-radius:4px;">${d.arquivo}</code></td>
                    <td><span class="tipo-mime">${d.mime}</span></td>
                    <td>${d.comentario}</td>
                    <td class="acoes">
                        <button title="Baixar">⬇️</button>
                        <button title="Visualizar">👁️</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    // ============================================================
    // FILTROS
    // ============================================================
    function filtrarDocumentos() {
        const busca = document.getElementById('buscaDoc').value.toLowerCase().trim();
        const entidade = document.getElementById('filtroEntidade').value;

        let filtrados = documentos;

        if (busca) {
            filtrados = filtrados.filter(d => 
                d.nome.toLowerCase().includes(busca) || 
                d.arquivo.toLowerCase().includes(busca)
            );
        }
        if (entidade) {
            filtrados = filtrados.filter(d => d.entidade === entidade);
        }

        renderizarTabela(filtrados);
    }

    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        popularFiltroEntidades();
        renderizarTabela(documentos);

        document.getElementById('buscaDoc').addEventListener('input', filtrarDocumentos);
        document.getElementById('filtroEntidade').addEventListener('change', filtrarDocumentos);
    });

    // ============================================================
    // MENU LATERAL – toggle
    // ============================================================
    document.querySelectorAll('.categoria[data-target]').forEach(cat => {
        cat.addEventListener('click', function(e) {
            const targetId = this.dataset.target;
            const sub = document.getElementById(targetId);
            if (sub) {
                sub.classList.toggle('aberto');
                const seta = this.querySelector('.seta');
                if (seta) seta.classList.toggle('aberta');
            }
        });
    });

    document.querySelector('.recolher')?.addEventListener('click', function() {
        document.querySelectorAll('.subitens').forEach(s => s.classList.remove('aberto'));
        document.querySelectorAll('.seta').forEach(s => s.classList.remove('aberta'));
    });
</script>

</body>
</html>
