<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - GLPI SIGPEC</title>
    <!-- Seu CSS exportado do Figma -->
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Pequenos ajustes para garantir o layout centralizado */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #F5F7FB;
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 61px 281px 117px 267px;
            gap: 46px;
            width: 1280px;
            height: 720px;
            background: #F5F7FB;
            box-sizing: border-box;
        }
        /* Ajuste para o logo (substitua pela sua imagem) */
        .logo-gestao {
            width: 200px;
            height: 81px;
            background: url('assets/logo.png') no-repeat center / contain;
            flex: none;
            order: 0;
            flex-grow: 0;
        }
        .quadro-branco {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 15px 201px;
            gap: 15px;
            width: 732px;
            height: 358px;
            background: #FFFFFF;
            flex: none;
            order: 1;
            flex-grow: 0;
            box-sizing: border-box;
        }
        .login-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            gap: 22px;
            width: 330px;
            height: 55px;
            background: #FFFFFF;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }
        .login-title {
            width: 330px;
            height: 21px;
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-weight: 600;
            font-size: 17px;
            line-height: 21px;
            text-align: center;
            color: #000000;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }
        .line-separator {
            width: 345px;
            height: 0px;
            border: 1px solid #D9DBDE;
            flex: none;
            order: 1;
            flex-grow: 0;
        }
        .campo-label {
            width: 330px;
            height: 17px;
            background: #FFFFFF;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
            position: relative;
        }
        .campo-label span {
            position: absolute;
            left: 0;
            top: 0;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 12px;
            line-height: 15px;
            color: #000000;
        }
        .campo-input {
            box-sizing: border-box;
            width: 330px;
            height: 35px;
            background: #FFFFFF;
            border: 1px solid #D9DBDE;
            border-radius: 2px;
            flex: none;
            order: 2;
            align-self: stretch;
            flex-grow: 0;
            padding: 0 8px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
        }
        .campo-senha {
            width: 330px;
            height: 13.39px;
            background: #FFFFFF;
            flex: none;
            order: 3;
            align-self: stretch;
            flex-grow: 0;
            position: relative;
        }
        .campo-senha .esqueceu {
            position: absolute;
            right: 0;
            top: 0;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 11px;
            line-height: 13px;
            color: #3B73A7;
            cursor: pointer;
        }
        .campo-senha .senha-label {
            position: absolute;
            left: 0;
            top: 0;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 12px;
            line-height: 15px;
            color: #000000;
        }
        .check-lembre {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0;
            gap: 4px;
            width: 330px;
            height: 24px;
            background: #FFFFFF;
            flex: none;
            order: 5;
            align-self: stretch;
            flex-grow: 0;
        }
        .check-lembre input[type="checkbox"] {
            width: 24px;
            height: 24px;
            flex: none;
            order: 0;
            flex-grow: 0;
            accent-color: #1C1B1F;
        }
        .check-lembre label {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 12px;
            line-height: 15px;
            color: #000000;
            flex: none;
            order: 1;
            flex-grow: 0;
        }
        .bt-iniciar {
            width: 330px;
            height: 44px;
            background: #CCEAFD;
            border-radius: 3px;
            flex: none;
            order: 6;
            align-self: stretch;
            flex-grow: 0;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 15px;
            line-height: 18px;
            color: #000000;
            cursor: pointer;
        }
        .bt-iniciar:hover {
            background: #b0d4e8;
        }
        .footer-copy {
            width: 284px;
            height: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 11px;
            line-height: 13px;
            color: #3B73A7;
            flex: none;
            order: 2;
            flex-grow: 0;
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Logo -->
    <div class="logo-gestao"></div>

    <!-- Quadro branco -->
    <div class="quadro-branco">
        <div class="login-inner">
            <div class="login-title">Login na sua Conta</div>
            <div class="line-separator"></div>
        </div>

        <!-- Campos de login -->
        <div class="campo-label">
            <span>Nome de utilizador</span>
        </div>
        <input class="campo-input" type="text" id="username" placeholder="Digite seu usuário" />

        <div class="campo-senha">
            <span class="senha-label">Palavra-passe</span>
            <span class="esqueceu">Esqueceu-se da palavra-passe?</span>
        </div>
        <input class="campo-input" type="password" id="password" placeholder="Digite sua senha" />

        <div class="check-lembre">
            <input type="checkbox" id="remember" />
            <label for="remember">Lembre-me</label>
        </div>

        <button class="bt-iniciar" id="btnLogin">Iniciar sessão</button>
    </div>

    <div class="footer-copy">GLPI Cpyright (C) 2015-2023 Teclib’ and contributors</div>
</div>

<script>
    document.getElementById('btnLogin').addEventListener('click', function() {
        // Simulação de login: redireciona para o painel do usuário
        // Em uma apresentação, pode-se também verificar se user=admin e senha=admin
        // Mas aqui vamos direto para a página do usuário.
        window.location.href = 'usuario.html';
    });
</script>

</body>
</html>
